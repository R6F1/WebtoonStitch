name: Build WebtoonStitch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract WebtoonStitch project
        shell: bash
        run: |
          set -e

          ZIP_FILE="WebtoonStitch-CLOUD-BUILD.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/source"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/source" \
            -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"

          echo "Project extracted successfully."
          ls -la

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Android SDK: $ANDROID_HOME"
          echo "SDK Manager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project
        run: |
          test -f gradlew
          test -f settings.gradle.kts
          test -d app
          echo "Project verification passed."

      - name: Build installable APK
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WebtoonStitch-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
